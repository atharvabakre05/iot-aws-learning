name: IoT Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install dependency scanner
        run: python -m pip install pip-audit

      - name: Scan dependencies
        run: pip-audit --requirement src/notification_consumer/requirements.txt

      - name: Validate SAM template
        run: sam validate --template-file template.yaml --lint

      - name: Build SAM application
        run: sam build --template-file template.yaml

  deploy-test:
    needs: validate-test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::909392367382:role/phase21-github-actions-deploy-role
          aws-region: ap-south-1
          role-session-name: phase22-github-actions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create artifact bucket if missing
        shell: bash
        run: |
          if ! aws s3api head-bucket --bucket phase22-sam-artifacts-909392367382 2>/dev/null; then
            aws s3api create-bucket \
              --bucket phase22-sam-artifacts-909392367382 \
              --region ap-south-1 \
              --create-bucket-configuration LocationConstraint=ap-south-1

            aws s3api put-public-access-block \
              --bucket phase22-sam-artifacts-909392367382 \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            aws s3api put-bucket-encryption \
              --bucket phase22-sam-artifacts-909392367382 \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Build SAM application
        run: sam build --template-file template.yaml

      - name: Deploy test stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name phase22-test \
            --s3-bucket phase22-sam-artifacts-909392367382 \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ap-south-1

      - name: Verify test stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name phase22-test \
            --query 'Stacks[0].{Name:StackName,Status:StackStatus,Outputs:Outputs}' \
            --output json