name: IoT Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install dependency scanner
        run: python -m pip install pip-audit

      - name: Scan dependencies
        run: pip-audit --requirement src/notification_consumer/requirements.txt

      - name: Validate SAM template
        run: sam validate --template-file template.yaml --lint

      - name: Build SAM application
        run: sam build --template-file template.yaml